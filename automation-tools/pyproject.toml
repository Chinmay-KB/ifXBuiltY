[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ifxbuilty-automation-tools"
version = "0.1.0"
description = "Approval-gated MCP tools for the ifXBuiltY Hermes agent"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2",
  "pydantic>=2,<3",
]

[project.scripts]
ifxbuilty-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["ifxbuilty_tools*"]
