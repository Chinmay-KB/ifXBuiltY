name: Site health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    branches:
      - main

concurrency:
  group: site-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Test
        run: yarn test

      - name: Lint
        run: yarn lint
